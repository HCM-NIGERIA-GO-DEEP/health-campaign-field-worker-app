# TC-007 (negative): a child failing eligibility must NOT reach delivery.
# Config answer key: first question (ec1) = "Yes" with the rest "No" routes to
# REFER_BENEFICIARY (the DEFAULT action) - delivery must not open.
# The flow adds a second child (CHILD2) so it never collides with the delivered
# CHILD from flow 05, asserts the Refer screen appears, then BACKS OUT without
# submitting - no referral record is created, nothing is delivered.
# PRECONDITIONS: 03 passed in THIS run; working hours + cycle window.
appId: com.digit.hcm
tags:
  - negative
  - needs-logged-in
---
- launchApp
# Shared preamble: handles login + per-launch boundary selection -> home
# (the app cold-starts on the boundary screen EVERY launch; see its header)
- runFlow: ../common/ensure-home.yaml
- tapOn:
    text: ${HOME_REG}
# Village-selection interstitial ("Select Your Village", device-observed
# 2026-09-02 17:44): this campaign asks which village to work in right after
# Registration & Delivery. The card is the boundary chosen at login
# (BOUNDARY_L2_VALUE). Every flow cold-starts the app, so the screen shows
# every time on this campaign; a campaign without it edits this step out.
- extendedWaitUntil:
    visible:
      text: "Select Your Village"
    timeout: 20000
- tapOn:
    text: ${BOUNDARY_L2_VALUE}
# NO hideKeyboard after the search inputText (route-pop trap, run -2252) and
# retype once on dropped keystrokes - see 04 for the full story.
# Localization settle gate + re-tap before retyping - see 03 for the full
# story (run -1128: ids go live one relayout before labels translate, the
# header then shrinks 133px and a tap aimed at the pre-translation bounds
# misses the field; an unfocused field also swallows eraseText/inputText).
- extendedWaitUntil:
    visible:
      text: "Search Beneficiary"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: ".*_searchBar"
    timeout: 20000
- tapOn:
    id: ".*_searchBar"
- inputText: "QATEST ${RUN_STAMP}"
# An open IME hides every Flutter node from Maestro (run -1314) - close it
# before the guard, or `notVisible` is trivially true. See close-keyboard.yaml.
- runFlow: ../common/close-keyboard.yaml
- runFlow:
    when:
      notVisible:
        text: "(?s).*QATEST ${RUN_STAMP}.*"
    commands:
      - tapOn:
          id: ".*_searchBar"
      - eraseText
      - inputText: "QATEST ${RUN_STAMP}"
      - runFlow: ../common/close-keyboard.yaml
# Wait for the right card, THEN open it via its Open button (config flow 6:
# memberCard > detailsRow > openMemberCard, label OPEN).
- extendedWaitUntil:
    visible:
      text: "(?s).*QATEST ${RUN_STAMP} HEAD.*"
    timeout: 15000
- tapOn:
    id: ".*_openMemberCard"
# Add Member is TWO mutually-exclusive config variants (REGISTRATION.json,
# proven pattern in run -1745): fieldName addMember when the unique-
# beneficiary-ID pool >= minimum, fieldName beneficiaryIdMinCheck (same
# visible label) when below; the low-pool popup's skip-and-continue button
# (fieldName clearFilter) proceeds to the same ADD_MEMBER form.
# Overview arrival on its always-visible top children, then scroll addMember in:
# it is body child #2 below listViewMembers and was absent from run -1245's
# hierarchy (off-screen); tapOn does NOT auto-scroll. See 04 for the same fix.
- extendedWaitUntil:
    visible:
      id: ".*_(householdDetails|listViewMembers)"
    timeout: 20000
# Add CHILD2 (eligible age - the blocking must come from the checklist, not age)
- scrollUntilVisible:
    element:
      id: ".*_(addMember|beneficiaryIdMinCheck)"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: ".*_(addMember|beneficiaryIdMinCheck)"
- tapOn:
    id: ".*clearFilter"
    optional: true
# Control id, not field id - the field-level `nameOfIndividual` node no longer
# exists once the input carries its own id (see 03 for the run -1432/-1135 proof).
- extendedWaitUntil:
    visible:
      id: "nameOfIndividual_input"
    timeout: 20000
- tapOn:
    id: "nameOfIndividual_input"
- inputText: "QATEST ${RUN_STAMP} CHILD2"
# Typed-name integrity (see 03): the CHILD2 card is matched by this name.
- runFlow:
    when:
      notVisible:
        text: "QATEST ${RUN_STAMP} CHILD2"
    commands:
      - eraseText
      - inputText: "QATEST ${RUN_STAMP} CHILD2"
- hideKeyboard
- assertVisible:
    text: "QATEST ${RUN_STAMP} CHILD2"
- tapOn:
    id: "familyname_input"
- inputText: "QATEST"
- hideKeyboard
# DOB via the AGE-in-months field (see 03/04): eligible age on purpose -
# the blocking must come from the checklist answer, not from age.
- tapOn:
    id: "dob_months"
- inputText: ${CHILD_AGE_MONTHS}
- hideKeyboard
# gender is a `select` -> SelectionCard, whose option chips are SINGLE nodes
# carrying both the label and the tap action (semantics-probed 2026-09-03),
# so they ARE reachable by text. No `tapOn: id: gender` first - that id sits
# on the field label block (see 03).
- tapOn:
    text: ${GENDER_CHILD}
# FORM footer by stable id (labels are per-page campaign texts; see 03)
- tapOn:
    id: "form_action"
- extendedWaitUntil:
    visible:
      id: ".*_successCard"
    timeout: 30000
# Back to the household: ADD_MEMBER always lands on the ACKNOWLEDGEMENT
# template (config), whose View-Household button is fieldName
# viewHouseholdButton.
- tapOn:
    id: ".*_viewHouseholdButton"
# Overview arrival on the always-visible top children (see above) - addMember is
# below the member list and is not in the tree on arrival.
- extendedWaitUntil:
    visible:
      id: ".*_(householdDetails|listViewMembers)"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "QATEST ${RUN_STAMP} CHILD2.*"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: ".*_deliveryButton"
    below:
      text: "QATEST ${RUN_STAMP} CHILD2.*"
# --- Eligibility: ec1 = Yes (disqualifying), rest No -> must route to Refer ---
# Radios by <fieldName>_<code> (config codes YES/NO) - see 05 for why neither
# `id: ec1` nor `text: "Yes"` can reach a radio. This flow's whole point is
# that ec1 SPECIFICALLY is the disqualifying Yes, so naming the field beats
# the old index-into-screen-order tap. Needs an APK built after 2026-09-03.
- extendedWaitUntil:
    visible:
      id: "ec1_(YES|NO)"
    timeout: 20000
- tapOn:
    id: "ec1_YES"
- tapOn:
    id: "ec2_NO"
- tapOn:
    id: "ec3_NO"
- tapOn:
    id: "ec4_NO"
- tapOn:
    id: "ec5_NO"
- tapOn:
    id: "form_action"
# --- MUST land on Refer Beneficiary (id from its form fields), NOT delivery ---
# referredBy is `string`/`text` (readOnly) -> JsonSchemaStringBuilder, the same
# builder as nameOfIndividual, so it carries `_input` and has likewise lost its
# field-level node. readOnly changes only the box's editability, not which
# semantics node exists. NOT yet device-confirmed: no run has reached this page.
- extendedWaitUntil:
    visible:
      id: "referredBy_input"
    timeout: 20000
- assertNotVisible:
    id: "resourceCard"
# Leave without creating a referral
- back
- back
