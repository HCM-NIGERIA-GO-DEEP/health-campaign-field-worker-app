# Smoke: home screen shows the core modules.
# PRECONDITION: already logged in (run 01-login-to-home first on a fresh device).
# The app cold-starts on the BOUNDARY screen every launch - the shared
# preamble handles login/boundary and lands on home (see its header).
# Read-only asserts after that; the preamble itself taps only login/boundary.
appId: com.digit.hcm
tags:
  - smoke
  - safe
  - needs-logged-in
---
- launchApp
- runFlow: ../common/ensure-home.yaml
- assertVisible:
    text: "Registration & Delivery"
- assertVisible: "Sync Data"
- scrollUntilVisible:
    element:
      text: "Manage Stock"
    direction: DOWN
    timeout: 20000
