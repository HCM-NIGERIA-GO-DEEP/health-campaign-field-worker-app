# TC-007 (negative), INELIGIBLE sub-case: a child whose LAST checklist
# question (ec5) is "Yes" must be routed straight back to the household
# overview - not to delivery, and not to the Refer Beneficiary form (that is
# the OTHER negative sub-case, ec1=Yes, covered by flow 07 with CHILD2).
# Config answer key (REGISTRATION.json CHECKLIST onAction, actionId 3):
#   ec5==YES -> FETCH_TRANSFORMER_CONFIG(ineligibleConfig) + CREATE_EVENT,
#   then navigate straight to "householdOverview" (popUntilAndPush,
#   popUntilPageName searchBeneficiary) - no beneficiaryDetails/Delivery
#   Details screen, no REFER_BENEFICIARY form. actionId 1/2 (all-No or the
#   ec3=Yes variant) require ec5==NO, so ec5=Yes can never fall through to the
#   "administered" branch; DEFAULT (actionId 4, referral) is only reached when
#   NEITHER the administer nor the ec5==YES condition matched, so ec1-ec4 are
#   set to "No" here to keep this run unambiguously in the ineligible branch.
# The flow adds a THIRD child (CHILD3) so it never collides with the delivered
# CHILD from flow 05 or the referred CHILD2 from flow 07 - one child exercises
# exactly one outcome. NOT yet device-confirmed: no run has reached this path.
# PRECONDITIONS: 03 passed in THIS run; working hours + cycle window.
appId: com.digit.hcm
tags:
  - negative
  - needs-logged-in
---
- launchApp
# Shared preamble: handles login + per-launch boundary selection -> home
# (the app cold-starts on the boundary screen EVERY launch; see its header)
- runFlow: ../common/ensure-home.yaml
- tapOn:
    text: ${HOME_REG}
# Village-selection interstitial ("Select Your Village", device-observed
# 2026-09-02 17:44): this campaign asks which village to work in right after
# Registration & Delivery. The card is the boundary chosen at login
# (BOUNDARY_L2_VALUE). Every flow cold-starts the app, so the screen shows
# every time on this campaign; a campaign without it edits this step out.
- extendedWaitUntil:
    visible:
      text: "Select Your Village"
    timeout: 20000
- tapOn:
    text: ${BOUNDARY_L2_VALUE}
# NO hideKeyboard after the search inputText (route-pop trap, run -2252) and
# retype once on dropped keystrokes - see 04 for the full story.
- extendedWaitUntil:
    visible:
      text: "Search Beneficiary"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: ".*_searchBar"
    timeout: 20000
- tapOn:
    id: ".*_searchBar"
- inputText: "QATEST ${RUN_STAMP}"
# An open IME hides every Flutter node from Maestro (run -1314) - close it
# before the guard, or `notVisible` is trivially true. See close-keyboard.yaml.
- runFlow: ../common/close-keyboard.yaml
- runFlow:
    when:
      notVisible:
        text: "(?s).*QATEST ${RUN_STAMP}.*"
    commands:
      - tapOn:
          id: ".*_searchBar"
      - eraseText
      - inputText: "QATEST ${RUN_STAMP}"
      - runFlow: ../common/close-keyboard.yaml
# Wait for the right card, THEN open it via its Open button (config flow 6:
# memberCard > detailsRow > openMemberCard, label OPEN).
- extendedWaitUntil:
    visible:
      text: "(?s).*QATEST ${RUN_STAMP} HEAD.*"
    timeout: 15000
- tapOn:
    id: ".*_openMemberCard"
# Add Member is TWO mutually-exclusive config variants (REGISTRATION.json,
# proven pattern in run -1745): fieldName addMember when the unique-
# beneficiary-ID pool >= minimum, fieldName beneficiaryIdMinCheck (same
# visible label) when below; the low-pool popup's skip-and-continue button
# (fieldName clearFilter) proceeds to the same ADD_MEMBER form.
- extendedWaitUntil:
    visible:
      id: ".*_(householdDetails|listViewMembers)"
    timeout: 20000
# Add CHILD3 (eligible age - the blocking must come from the checklist, not age)
- scrollUntilVisible:
    element:
      id: ".*_(addMember|beneficiaryIdMinCheck)"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: ".*_(addMember|beneficiaryIdMinCheck)"
- tapOn:
    id: ".*clearFilter"
    optional: true
# Control id, not field id - the field-level `nameOfIndividual` node no longer
# exists once the input carries its own id (see 03 for the run -1432/-1135 proof).
- extendedWaitUntil:
    visible:
      id: "nameOfIndividual_input"
    timeout: 20000
- tapOn:
    id: "nameOfIndividual_input"
- inputText: "QATEST ${RUN_STAMP} CHILD3"
# Typed-name integrity (see 03): the CHILD3 card is matched by this name.
- runFlow:
    when:
      notVisible:
        text: "QATEST ${RUN_STAMP} CHILD3"
    commands:
      - eraseText
      - inputText: "QATEST ${RUN_STAMP} CHILD3"
- hideKeyboard
- assertVisible:
    text: "QATEST ${RUN_STAMP} CHILD3"
- tapOn:
    id: "familyname_input"
- inputText: "QATEST"
- hideKeyboard
# DOB via the AGE-in-months field (see 03/04): eligible age on purpose -
# the blocking must come from the checklist answer, not from age.
- tapOn:
    id: "dob_months"
- inputText: ${CHILD_AGE_MONTHS}
- hideKeyboard
# gender is a `select` -> SelectionCard, whose option chips are SINGLE nodes
# carrying both the label and the tap action (semantics-probed 2026-09-03),
# so they ARE reachable by text. No `tapOn: id: gender` first - that id sits
# on the field label block (see 03).
- tapOn:
    text: ${GENDER_CHILD}
# FORM footer by stable id (labels are per-page campaign texts; see 03)
- tapOn:
    id: "form_action"
# ADD_MEMBER is single-page -> blank-buttoned "Ready to submit?" dialog.
- runFlow: ../common/confirm-submit.yaml
- extendedWaitUntil:
    visible:
      id: ".*_successCard"
    timeout: 30000
# Back to the household: ADD_MEMBER always lands on the ACKNOWLEDGEMENT
# template (config), whose View-Household button is fieldName
# viewHouseholdButton. It is nested inside the panelCard's primaryAction, one
# relayout behind the panelCard's OWN successCard id - wait on the button's
# own id before tapping (see 07 for the device-confirmed race, run -1711).
- extendedWaitUntil:
    visible:
      id: ".*_viewHouseholdButton"
    timeout: 20000
- tapOn:
    id: ".*_viewHouseholdButton"
- extendedWaitUntil:
    visible:
      id: ".*_(householdDetails|listViewMembers)"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "QATEST ${RUN_STAMP} CHILD3.*"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: ".*_deliveryButton"
    below:
      text: "QATEST ${RUN_STAMP} CHILD3.*"
# --- Eligibility: ec5 = Yes (the ineligible-specific disqualifier), rest No ---
# actionId 3's condition is ec5==YES alone; ec1-ec4 are set to No purely to
# keep this run unambiguous (see header) - they do not affect which branch
# fires. Radios by <fieldName>_<code> id - see 05 for why neither `id: ec5`
# nor `text: "Yes"` can reach a radio.
- extendedWaitUntil:
    visible:
      id: "ec1_(YES|NO)"
    timeout: 20000
- tapOn:
    id: "ec1_NO"
- tapOn:
    id: "ec2_NO"
- tapOn:
    id: "ec3_NO"
- tapOn:
    id: "ec4_NO"
# ec5 sits below the fold (5 questions above a fixed footer) - tapOn does NOT
# auto-scroll. See 05 for the device-confirmed cutoff (run -1620).
- scrollUntilVisible:
    element:
      id: "ec5_(YES|NO)"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "ec5_YES"
- tapOn:
    id: "form_action"
# CHECKLIST (config flow 9) is single-page with showAlertPopUp -> the same
# blank-buttoned "Ready to submit?" dialog as the add-member submit above
# (this dialog's title/body differ per branch - "Ineligible flow" here - but
# the button ids are the same form_alert_primary/secondary).
- runFlow: ../common/confirm-submit.yaml
# --- MUST land straight back on the household overview - NOT delivery, NOT
# the referral form. actionId 3 pops until searchBeneficiary/householdOverview
# with no intermediate screen, unlike actionId 4 (REFER_BENEFICIARY form) or
# actionId 1/2 (beneficiaryDetails -> Delivery Details).
- extendedWaitUntil:
    visible:
      id: ".*_(householdDetails|listViewMembers)"
    timeout: 20000
- assertNotVisible:
    id: "referredBy_input"
- assertNotVisible:
    id: "resourceCard"
- assertNotVisible:
    id: ".*_successCard"
