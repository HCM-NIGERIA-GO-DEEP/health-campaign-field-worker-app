# Smoke (TC-001): fresh login through boundary selection to the home screen.
# PRECONDITION: the app is logged OUT (fresh install, or logged out manually).
# This flow deliberately does NOT use clearState - clearing app data permanently
# deletes unsynced locally-created records. Do a fresh install yourself if needed.
#
# The entire login -> [projects] -> boundary -> home logic lives in the shared
# preamble ../common/ensure-home.yaml (used by every flow, because the app
# shows the boundary screen on EVERY cold start - see that file's header for
# the launch-state machine and the hard-won selector rules).
# Requires maestro.env (see maestro.env.example): USERNAME, PASSWORD, and per
# boundary level BOUNDARY_Lx_LABEL + BOUNDARY_Lx_VALUE.
#
# Login ids (login_userId/password/submit) and boundary ids
# (boundary_<levelName>, boundary_submit) come from the semantics-identifier
# patches (patches/README.md) - an APK built WITHOUT them fails at the first
# id: step (signal to rebuild, not to edit flows). PASSED end-to-end on
# emulator-5554, run 2026-09-02-1601.
appId: com.digit.hcm
tags:
  - smoke
  - needs-logged-out
---
- launchApp
- runFlow: ../common/ensure-home.yaml
# Explicit end-state assert (ensure-home already waited for it; this makes
# the test's own verdict independent of the preamble's internals)
- assertVisible:
    text: ${HOME_REG}
