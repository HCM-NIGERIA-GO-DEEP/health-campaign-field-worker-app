# TC-005: Deliver SMC to the eligible child from TC-004.
# PRECONDITIONS: 03 + 04 passed in THIS run; inside working hours + cycle window;
# daily delivery cap has headroom; the logged-in user has stock for the delivery
# resource (an "insufficient stock" popup at Record-Cycle-Dose is an environment
# problem, not an app bug - the flow fails loudly there by design).
#
# Eligibility answer key (from REGISTRATION.json CHECKLIST onAction conditions,
# not guessed - actionId 1/2 route to beneficiaryDetails/delivery):
#   ALL FIVE questions = "No"  -> proceed to delivery (this flow)
#   ec5=Yes                    -> ineligible, straight back to householdOverview
#                                  (actionId 3) - covered by flow 08
#   any other Yes (e.g. ec1)   -> refer (DEFAULT/actionId 4) - covered by flow 07
# On-screen field order is ec1, ec2, ec3, ec4 (visible only when ec3==NO), ec5 -
# addressed by <fieldName>_<code> id, not screen position.
# FIRST-RUN CHECKPOINTS: the member-card button text (BTN_RECORD, default
# "Record Data"), and the resourceCard confirm tap on Delivery Details.
appId: com.digit.hcm
tags:
  - smoke
  - needs-logged-in
---
- launchApp
# Shared preamble: handles login + per-launch boundary selection -> home
# (the app cold-starts on the boundary screen EVERY launch; see its header)
- runFlow: ../common/ensure-home.yaml
- tapOn:
    text: ${HOME_REG}
# Village-selection interstitial ("Select Your Village", device-observed
# 2026-09-02 17:44): this campaign asks which village to work in right after
# Registration & Delivery. The card is the boundary chosen at login
# (BOUNDARY_L2_VALUE). Every flow cold-starts the app, so the screen shows
# every time on this campaign; a campaign without it edits this step out.
- extendedWaitUntil:
    visible:
      text: "Select Your Village"
    timeout: 20000
- tapOn:
    text: ${BOUNDARY_L2_VALUE}
# NO hideKeyboard after the search inputText (route-pop trap, run -2252) and
# retype once on dropped keystrokes - see 04 for the full story.
# Localization settle gate + re-tap before retyping - see 03 for the full
# story (run -1128: ids go live one relayout before labels translate, the
# header then shrinks 133px and a tap aimed at the pre-translation bounds
# misses the field; an unfocused field also swallows eraseText/inputText).
- extendedWaitUntil:
    visible:
      text: "Search Beneficiary"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: ".*_searchBar"
    timeout: 20000
- tapOn:
    id: ".*_searchBar"
- inputText: "QATEST ${RUN_STAMP}"
# An open IME hides every Flutter node from Maestro (run -1314) - close it
# before the guard, or `notVisible` is trivially true. See close-keyboard.yaml.
- runFlow: ../common/close-keyboard.yaml
- runFlow:
    when:
      notVisible:
        text: "(?s).*QATEST ${RUN_STAMP}.*"
    commands:
      - tapOn:
          id: ".*_searchBar"
      - eraseText
      - inputText: "QATEST ${RUN_STAMP}"
      - runFlow: ../common/close-keyboard.yaml
# Wait for the right card, THEN open it via its Open button (config flow 6:
# memberCard > detailsRow > openMemberCard, label OPEN). Tapping the name text
# does not navigate.
- extendedWaitUntil:
    visible:
      text: "(?s).*QATEST ${RUN_STAMP} HEAD.*"
    timeout: 15000
- tapOn:
    id: ".*_openMemberCard"
# Overview proof: gate on the body children that are ALWAYS in view
# (householdDetails(0) / listViewMembers(1)). addMember(2) sits below the member
# list and was absent from run -1245's hierarchy, so it is not an arrival proof.
- extendedWaitUntil:
    visible:
      id: ".*_(householdDetails|listViewMembers)"
    timeout: 20000
# Record for the CHILD (anchor the button to the child's card, not the head's).
# Config: the per-member record button is fieldName deliveryButton (label code
# DELIVERY, campaign-localized) - select by id, anchored below the child card.
- scrollUntilVisible:
    element:
      text: "QATEST ${RUN_STAMP} CHILD.*"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: ".*_deliveryButton"
    below:
      text: "QATEST ${RUN_STAMP} CHILD.*"
# --- Eligibility Assessment: all five answers "No" (config: NO NO NO NO NO -> deliver) ---
# Each radio is addressed by <fieldName>_<code> (config codes YES/NO), so the
# answers no longer depend on on-screen field order the way the old
# index-based text taps did - a re-ordered config used to silently answer the
# wrong question. `text: "No"` cannot work at all here: option
# labels are absorbed into each field's merged label node and the radio itself
# is a bare clickable node (run -1214, consent page). Needs an APK built after
# 2026-09-03.
- extendedWaitUntil:
    visible:
      id: "ec1_(YES|NO)"
    timeout: 20000
- tapOn:
    id: "ec1_NO"
- tapOn:
    id: "ec2_NO"
- tapOn:
    id: "ec3_NO"
- tapOn:
    id: "ec4_NO"
# ec5 sits below the fold: the page has 5 questions above a fixed "Save
# Delivery" footer and only ~4 fit on an emulator screen; tapOn does NOT
# auto-scroll (same rule as the addMember/deliveryButton scrolls elsewhere in
# this kit). ec1-ec4 above were confirmed reachable without scrolling
# (run -1620 got this far before failing at ec5).
- scrollUntilVisible:
    element:
      id: "ec5_(YES|NO)"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "ec5_NO"
# FORM footer by stable id (labels are per-page campaign texts; see 03)
- tapOn:
    id: "form_action"
# CHECKLIST (config flow 9) is a single-page flow with showAlertPopUp, so this
# submit raises the blank-buttoned "Ready to submit?" dialog. The two later
# form_action taps in this flow do NOT: DELIVERY's alert sits on order 1, which
# still has order 2 after it. See confirm-submit.yaml.
- runFlow: ../common/confirm-submit.yaml
# --- Child summary (beneficiary-details template) -> Record Cycle Dose ---
- extendedWaitUntil:
    visible:
      id: ".*_recordCycle"
    timeout: 20000
- tapOn:
    id: ".*_recordCycle"
# --- Delivery Details: resource card is auto-selected by age; confirm-tap it.
# resourceCard is a readonly CUSTOM widget and may expose no semantics (like
# the location page's custom fields) - accept the page's deliveryComment
# dropdown as arrival proof too.
- extendedWaitUntil:
    visible:
      id: "(resourceCard|deliveryComment)"
    timeout: 20000
- tapOn:
    id: "resourceCard"
    optional: true
- tapOn:
    id: "form_action"
# --- "Please check you have done the following": all three confirmations ---
# Checkboxes have the radio problem: DigitCheckbox puts the tappable 24x24 box
# and its label in SIBLING nodes, so the box carries no label and the field id
# (ACTION1) lands on the label block - a node that spans the whole field and
# whose centre is on the TEXT, so tapping it never toggles. Semantics-probed
# 2026-09-03. Tap the box's own id instead: <fieldName>_checkbox, added by the
# vendored DigitCheckbox change; needs an APK built after 2026-09-03.
- extendedWaitUntil:
    visible:
      id: "ACTION1_checkbox"
    timeout: 20000
- tapOn:
    id: "ACTION1_checkbox"
- tapOn:
    id: "ACTION2_checkbox"
- tapOn:
    id: "ACTION3_checkbox"
- tapOn:
    id: "form_action"
# --- Delivery recorded ---
- extendedWaitUntil:
    visible:
      id: ".*_successCard"
    timeout: 30000
